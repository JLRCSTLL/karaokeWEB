services:
  postgres:
    image: postgres:16-alpine
    container_name: qr-karaoke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_karaoke
    ports:
      - "5432:5432"
    volumes:
      - qr-karaoke-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qr_karaoke"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qr-karaoke-postgres-data:
